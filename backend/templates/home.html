{% extends "base.html" %}
{% block content %}
<div class="text-center py-20">
  <h1 class="text-5xl font-bold font-heading mb-6 text-navy">Welcome to MnemoGraph</h1>
  <p class="text-xl text-muted-grey mb-12 max-w-2xl mx-auto">
    Your institutional hub for Graph-Augmented Collective Memory, knowledge discovery, and research intelligence.
  </p>
</div>

<!-- Newsletter Capture Placeholder -->
<div class="bg-cream border border-brand rounded-none p-8 mt-12 text-center">
  <h3 class="text-2xl font-bold font-heading text-ink mb-2">Join the Community</h3>
  <p class="text-muted-grey mb-6">Get a weekly roundup of the top news, guides, and resources.</p>
  <form class="flex flex-col sm:flex-row justify-center max-w-md mx-auto gap-2">
    <input type="email" placeholder="Your email address"
      class="flex-grow text-sm border border-brand px-4 py-3 focus:outline-none focus:border-ink rounded-none bg-white">
    <button type="button"
      class="bg-gold text-navy hover:bg-yellow-400 px-6 py-3 rounded-none font-bold text-sm tracking-wide transition-colors whitespace-nowrap">SUBSCRIBE</button>
  </form>
</div>
{% endblock content %}
